{% extends 'base.html' %}
{% load static %}

{% block title %}Стать исполнителем - Elysium{% endblock %}

{% block content %}
<div class="container" style="max-width: 600px; margin: 100px auto 40px; padding: 0 20px;">
    <div class="card">
        <div style="text-align: center; margin-bottom: 30px;">
            <i class="fas fa-briefcase" style="font-size: 60px; color: #6366f1;"></i>
            <h1>Стать исполнителем</h1>
            <p>Заполните информацию о себе и начните зарабатывать</p>
        </div>

        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label>Категория услуг *</label>
                <select name="category" required>
                    <option value="">Выберите категорию</option>
                    {% for category in categories %}
                    <option value="{{ category.slug }}">{{ category.icon }} {{ category.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Цена за час (₽) *</label>
                <input type="number" name="price" required placeholder="1000" min="0" step="1">
            </div>

            <div class="form-group">
                <label>Описание услуг *</label>
                <textarea name="description" rows="5" required placeholder="Расскажите о своем опыте, навыках и услугах..."></textarea>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">
                <i class="fas fa-check-circle"></i> Стать исполнителем
            </button>
        </form>

        <p style="text-align: center; margin-top: 20px; font-size: 13px; color: #6b7280;">
            После регистрации вы сможете получать заказы от клиентов
        </p>
    </div>
</div>
{% endblock %}
