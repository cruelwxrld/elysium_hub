{% extends 'base.html' %}
{% load static %}

{% block title %}Создание заказа - Elysium{% endblock %}

{% block content %}
<div class="container" style="max-width: 700px; margin: 100px auto 40px; padding: 0 20px;">
    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h1><i class="fas fa-shopping-cart"></i> Создание заказа</h1>
            <a href="{% url 'home' %}" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Назад
            </a>
        </div>

        <form method="post" action="/create-order/" id="orderForm">
            {% csrf_token %}

            <input type="hidden" name="category" id="hiddenCategory" value="repair">

            <div class="form-group">
                <label>Выберите исполнителя</label>
                <select name="performer_id" id="performerSelect">
                    <option value="">Любой исполнитель</option>
                    {% for performer in performers %}
                    <option value="{{ performer.user.id }}" {% if selected_performer_id == performer.user.id|stringformat:"s" %}selected{% endif %}>
                        {{ performer.user.username }} - {{ performer.category|default:"Любая категория" }} ({{ performer.price|default:"Договорная" }} ₽/час)
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group" id="performerServices" style="display: none;"></div>

            <div class="form-group">
                <label>Категория услуги *</label>
                <select id="categorySelect" required>
                    <option value="repair">🔧 Ремонт</option>
                    <option value="cleaning">🧹 Уборка</option>
                    <option value="delivery">🚚 Доставка</option>
                    <option value="construction">🏗️ Строительство</option>
                    <option value="design">🎨 Дизайн</option>
                    <option value="photography">📸 Фотография</option>
                    <option value="it">💻 IT</option>
                    <option value="education">📚 Образование</option>
                    <option value="beauty">💅 Красота</option>
                </select>
            </div>

            <div class="form-group" id="subcategoryGroup" style="display: none;">
                <label>Конкретная услуга</label>
                <select name="subcategory" id="subcategorySelect">
                    <option value="">Выберите услугу</option>
                </select>
            </div>

            <div class="form-group">
                <label>Название заказа *</label>
                <input type="text" name="title" required placeholder="Например: Уборка квартиры">
            </div>

            <div class="form-group">
                <label>Описание заказа *</label>
                <textarea name="description" rows="5" required placeholder="Опишите подробнее, что нужно сделать..."></textarea>
            </div>

            <div class="form-group">
                <label>Бюджет (₽) *</label>
                <input type="number" name="budget" required placeholder="1000" min="0" step="1">
            </div>

            <div id="priceHint" class="form-group"></div>

            <div class="form-group">
                <label>Желаемая дата</label>
                <input type="datetime-local" name="deadline">
            </div>

            <div class="form-group">
                <label>Адрес выполнения</label>
                <input type="text" name="address" id="addressInput" placeholder="Улица, дом, квартира" value="{{ user_location.address|default:'' }}">
                <button type="button" class="btn-location" onclick="getCurrentLocation()">
                    <i class="fas fa-location-dot"></i> Использовать моё местоположение
                </button>
            </div>

            <input type="hidden" name="latitude" id="latitudeInput" value="{{ user_location.latitude|default:'' }}">
            <input type="hidden" name="longitude" id="longitudeInput" value="{{ user_location.longitude|default:'' }}">

            <div class="form-buttons">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-paper-plane"></i> Отправить заказ
                </button>
                <a href="{% url 'home' %}" class="btn btn-secondary">
                    <i class="fas fa-times"></i> Отмена
                </a>
            </div>
        </form>
    </div>
</div>

<style>
    .card {
        background: white;
        border-radius: 24px;
        padding: 32px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .form-group {
        margin-bottom: 20px;

    }
    .form-group label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 8px;
        color: #374151;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        font-size: 14px;
        font-family: 'Inter', sans-serif;
        transition: all 0.3s;
        box-sizing: border-box;
        resize: none;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
        outline: none;
        border-color: #6366f1;
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }
    .btn-location {
        width: 100%;
        background: #f3f4f6;
        border: 1px solid #e5e7eb;
        padding: 10px 16px;
        border-radius: 12px;
        cursor: pointer;
        font-size: 13px;
        margin-top: 8px;
        transition: all 0.3s;
    }
    .btn-location:hover {
        background: #e5e7eb;
        border-color: #6366f1;
        color: #6366f1;
    }
    .form-buttons {
        display: flex;
        gap: 12px;
        margin-top: 30px;
    }
    .form-buttons .btn {
        flex: 1;
        justify-content: center;
        padding: 14px;
    }
    @media (max-width: 768px) {
        .card {
            padding: 20px;
        }
        .form-buttons {
            flex-direction: column;
        }
    }
</style>

<script src="{% static 'main/js/create_order.js' %}"></script>
{% endblock %}
