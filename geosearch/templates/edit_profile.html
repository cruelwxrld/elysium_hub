{% extends 'base.html' %}
{% load static %}

{% block title %}Редактирование профиля - Elysium{% endblock %}

{% block content %}
<div class="container" style="max-width: 600px; margin: 100px auto 40px; padding: 0 20px;">
    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h1><i class="fas fa-edit"></i> Редактирование профиля</h1>
            <a href="{% url 'profile' %}" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Назад
            </a>
        </div>

        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label>Телефон</label>
                <input type="tel" name="phone" value="{{ profile.phone|default:'' }}" placeholder="+7 (999) 123-45-67">
            </div>

            <div class="form-group">
                <label>Адрес</label>
                <input type="text" name="address" value="{{ profile.address|default:'' }}" placeholder="Ваш адрес">
            </div>

            {% if profile.role == 'performer' %}
            <div class="form-group">
                <label>Основная категория услуг</label>
                <select name="category" id="performerCategory">
                    <option value="">Выберите категорию</option>
                    {% for category in categories %}
                    <option value="{{ category.slug }}" {% if profile.category == category.slug %}selected{% endif %}>
                        {{ category.icon }} {{ category.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group" id="servicesGroup">
                <label>Какие услуги вы предоставляете?</label>
                <div class="services-checkboxes" id="servicesCheckboxes"></div>
                <input type="hidden" name="services" id="servicesInput" value="{{ profile.services|default:'' }}">
                <small class="form-hint">Выберите конкретные услуги, которые вы готовы выполнять</small>
            </div>

            <div class="form-group">
                <label>Цена за час (₽)</label>
                <input type="number" name="price" value="{{ profile.price|default:'' }}" placeholder="1000">
            </div>

            <div class="form-group">
                <label>Описание услуг</label>
                <textarea name="description" rows="5" placeholder="Расскажите о себе...">{{ profile.description|default:'' }}</textarea>
            </div>

            <div class="form-group">
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" name="is_available" {% if profile.is_available %}checked{% endif %}
                    style="width: 18px; height: 18px;">
                    Доступен для заказов
                </label>
            </div>
            {% endif %}

            <button type="submit" class="btn btn-primary" style="width: 100%;">
                <i class="fas fa-save"></i> Сохранить изменения
            </button>
        </form>
    </div>
</div>

<script src="{% static 'main/js/edit_profile.js' %}"></script>
{% endblock %}
